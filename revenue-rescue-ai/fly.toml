# Fly.io config. NOT deployed. Rename `app` (must be globally unique). Secrets are set with `fly secrets set`, never here.
app = "revenue-rescue-CHANGE-ME"
primary_region = "dfw"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep 1 warm: webhooks (Twilio/Stripe) must never hit a cold start timeout

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
